worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        # Non-root nginx cannot bind privileged port 80; the compose
        # file maps the published port to 8080.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Uploaded OpenAPI documents are up to 10MB (matching the backend
        # spring.servlet.multipart limits); nginx default is 1MB.
        client_max_body_size 10m;

        # SPA fallback: Angular client-side routes (e.g. /contracts/:id)
        # must resolve to index.html instead of 404 on refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to the backend service (same compose network).
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Served static assets: content hash in the name, cache aggressively.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
